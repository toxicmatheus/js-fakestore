<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loja</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
<header class=" flex items-center justify-between px-15 py-4 bg-cyan-500">
    <div>
        <input class="w-120 h-10 rounded bg-white pl-4" type="text" placeholder="Digite o nome do produto">
    </div>
    <div>
        <select id="categorias">
            <option>Men's clothing</option>
            <option>Women's clothing</option>
            <option>Electronics</option>
            <option>Jewelry</option>
        </select>
        <select id="ordenacao">
            <option value="preco">Ordenar por Preço</option>
            <option value="nota">Ordenar por Avaliação</option>
        </select>
    </div>
</header>

<main class="p-15 bg-slate-100">
    <div id = "cards" class="grid grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded shadow">
            <div class="relative">
                <img src="" alt="" class="h-55 object-contain">
                <div class="p-2 bg-cyan-500 text-white font-bold">4.0</div>
            </div>
        </div>
    </div>
</main>

<script src="index.js"></script>
</body>
</html>
